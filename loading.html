<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      background: #050510;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      font-family: 'Courier New', monospace;
      color: #8090ff;
    }
    .spinner {
      width: 80px;
      height: 80px;
      border: 3px solid rgba(128, 144, 255, 0.15);
      border-top-color: #8090ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title {
      font-size: 32px;
      letter-spacing: 12px;
      text-transform: uppercase;
      color: #e0e6ff;
    }
    .subtitle {
      font-size: 14px;
      letter-spacing: 4px;
      color: rgba(128, 144, 255, 0.5);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="title">✦ PHOTOBOOTH ✦</div>
  <div class="spinner"></div>
  <div class="subtitle">DÉMARRAGE EN COURS...</div>
  <script>
    // Essaie de se connecter au front toutes les 2s
    function tryConnect() {
      fetch('http://localhost:4200')
        .then(() => { window.location.href = 'http://localhost:4200'; })
        .catch(() => { setTimeout(tryConnect, 2000); });
    }
    setTimeout(tryConnect, 3000);
  </script>
</body>
</html>
